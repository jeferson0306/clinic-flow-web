name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Unit tests only — validations/br.ts and lib/utils.ts are pure
      # functions with no network dependency. e2e/ needs a live clinic-flow
      # backend (see e2e/README.md) and is deliberately not run here.
      - run: pnpm test -- --run

      - run: pnpm build
        env:
          CLINIC_FLOW_API_URL: http://localhost:8080
          NEXT_PUBLIC_APP_URL: http://localhost:3000
